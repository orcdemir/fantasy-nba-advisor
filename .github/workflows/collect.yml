name: collect

on:
  schedule:
    # 02:30 UTC = 05:30 Türkiye saati; GitHub cron birkaç dakika gecikebilir.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --nologo

      # Hata olsa bile snapshot'a status=error yazılır; eski veri taze gibi sunulmaz.
      - name: Collect
        id: collect
        continue-on-error: true
        run: dotnet run --project src/FantasyAdvisor.Cli -c Release -- collect data

      - name: Analyze
        run: dotnet run --project src/FantasyAdvisor.Cli -c Release -- analyze data

      - name: Commit data
        run: |
          git config user.name "fantasy-advisor-bot"
          git config user.email "fantasy-advisor-bot@users.noreply.github.com"
          git add data/snapshots data/analysis
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "data: günlük snapshot ve analiz"
            git push
          fi

      - name: Fail the run if collection failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
